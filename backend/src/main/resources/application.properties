spring.application.name=backend

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_celulares
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:6032}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8081

# JWT
jwt.secret=${JWT_SECRET:tienda-celulares-secret-key-super-segura-2024-min32bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# MercadoPago
spring.config.import=optional:classpath:application-secrets.properties
mercadopago.access-token=${MP_ACCESS_TOKEN:${mercadopago.access-token:}}
mercadopago.public-key=${MP_PUBLIC_KEY:${mercadopago.public-key:}}