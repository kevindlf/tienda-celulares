spring.application.name=backend

# Base de datos (Sin exponer Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mi_base_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8081

# JWT (Sin valor por defecto, obligando a que se inyecte por entorno)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# MercadoPago (Esto lo tenías bien)
spring.config.import=optional:classpath:application-secrets.properties
mercadopago.access-token=${MP_ACCESS_TOKEN:${mercadopago.access-token:}}
mercadopago.public-key=${MP_PUBLIC_KEY:${mercadopago.public-key:}}

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# APIs Externas (Esto lo tenías bien, valores por defecto vacíos)
gemini.api.key=${GEMINI_API_KEY:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}